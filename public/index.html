<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>블로그 마케팅 실시간 상담</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800 antialiased">

  <!-- Main Container -->
  <div class="w-full max-w-lg h-screen sm:h-[780px] bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200/80">

    <!-- ================= 1. ONBOARDING / ENTRY FORM ================= -->
    <div id="entrySection" class="flex-1 flex flex-col justify-between p-6 sm:p-8 bg-gradient-to-b from-blue-50/50 via-white to-white overflow-y-auto">
      <div>
        <!-- Brand / Header -->
        <div class="text-center mt-4 mb-8">
          <div class="w-16 h-16 mx-auto bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4 transform -rotate-3 transition hover:rotate-0">
            <i data-lucide="message-circle-heart" class="w-9 h-9"></i>
          </div>
          <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-100/70 text-blue-700 text-xs font-semibold rounded-full mb-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            상담원 실시간 대기 중
          </div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">블로그 마케팅 상담</h1>
        </div>

        <!-- Form Card -->
        <form id="entryForm" class="space-y-4 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">
              성함 / 고객명 <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input 
                type="text" 
                id="customerNameInput" 
                required 
                placeholder="홍길동"
                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
              >
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">
              휴대폰 번호 <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input 
                type="tel" 
                id="customerPhoneInput" 
                required 
                maxlength="13" 
                placeholder="010-1234-5678"
                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
              >
            </div>
            <div class="mt-2 p-2.5 bg-blue-50/80 rounded-xl border border-blue-100 flex items-start gap-2 text-[11px] text-blue-700 leading-relaxed">
              <i data-lucide="info" class="w-3.5 h-3.5 text-blue-500 shrink-0 mt-0.5"></i>
              <span>기존에 상담을 진행하셨던 휴대폰 번호를 입력하시면 이전 대화창으로 자동 연결됩니다.</span>
            </div>
          </div>

          <button 
            type="submit" 
            id="startChatBtn"
            class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/25 transition duration-150 flex items-center justify-center gap-2 group"
          >
            <span>상담 시작하기</span>
            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition"></i>
          </button>
        </form>
      </div>

      <!-- Footer Info -->
      <div class="text-center mt-6 text-xs text-slate-400">
        <p>평일 10:30 ~ 20:00 (점심시간 13:00 ~ 14:00)</p>
        <p class="mt-0.5">상담 대기시간은 평균 3분 이내입니다.</p>
      </div>
    </div>

    <!-- ================= 2. LIVE CHAT ROOM ================= -->
    <div id="chatSection" class="hidden flex-1 flex-col h-full bg-slate-50">
      
      <!-- Chat Header -->
      <div class="bg-white px-4 py-3.5 border-b border-slate-200/90 flex items-center justify-between shadow-xs z-10">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-blue-500/20">
              <i data-lucide="headset" class="w-5 h-5"></i>
            </div>
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h2 class="font-bold text-sm text-slate-900">블로그 마케팅 상담팀</h2>
              <span id="chatRoomStatusBadge" class="text-[10px] font-medium bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">상담중</span>
            </div>
            <p class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              실시간 온라인 상담
            </p>
          </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center gap-1">
          <button 
            id="copyLinkBtn" 
            title="상담 링크 복사" 
            class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition text-xs flex items-center gap-1 font-medium"
          >
            <i data-lucide="share-2" class="w-4 h-4"></i>
            <span class="hidden sm:inline">링크 복사</span>
          </button>
          <button 
            id="restartChatBtn" 
            title="새 상담 시작" 
            class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition"
          >
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Closed Notice Banner (hidden by default) -->
      <div id="closedBanner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-2 text-center text-xs text-amber-800">
        <span class="font-semibold">상담이 완료되었습니다.</span> 새로운 문의사항이 있으시면 
        <button id="closedRestartBtn" class="underline font-bold hover:text-amber-900 ml-1">새 상담 시작</button>을 클릭해주세요.
      </div>

      <!-- Messages Area -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3.5 scroll-smooth">
        <!-- Messages will be rendered here dynamically -->
      </div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="hidden px-4 py-1.5 text-xs text-slate-400 flex items-center gap-2">
        <div class="flex items-center gap-1 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-xs">
          <span class="text-slate-500 font-medium">상담원이 답변 작성 중</span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dot1"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dot2"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dot3"></span>
        </div>
      </div>

      <!-- Message Input Bar -->
      <div class="bg-white p-3 border-t border-slate-200">
        <form id="messageForm" class="flex items-center gap-2">
          <input 
            type="text" 
            id="messageInput" 
            autocomplete="off" 
            placeholder="메시지를 입력하세요..." 
            class="flex-1 bg-slate-100 border border-transparent focus:border-blue-500 focus:bg-white rounded-xl px-4 py-3 text-sm focus:outline-none transition"
          >
          <button 
            type="submit" 
            id="sendMessageBtn"
            class="w-11 h-11 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl flex items-center justify-center transition shadow-md shadow-blue-500/20 shrink-0"
          >
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </form>
      </div>

    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-sm text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Client Logic -->
  <script src="/js/customer.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
