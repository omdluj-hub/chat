<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객관리 실시간 채팅 콘솔 (관리자)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            admin: {
              50: '#f8fafc',
              100: '#f1f5f9',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e293b',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden antialiased select-none">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between border-b border-slate-800 shadow-md shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-base tracking-tight">상담 CRM 관리자 콘솔</h1>
          <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            실시간 연동 중
          </span>
        </div>
        <p class="text-[11px] text-slate-400">고객 실시간 문의 및 이력 관리 플랫폼</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">
      <!-- Sound Toggle -->
      <button 
        id="soundToggleBtn" 
        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs flex items-center gap-1.5 border border-slate-700 transition"
      >
        <i data-lucide="bell" id="soundIcon" class="w-4 h-4 text-emerald-400"></i>
        <span id="soundText">알림음 ON</span>
      </button>

      <!-- Browser Notification Button -->
      <button 
        id="notiToggleBtn" 
        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs flex items-center gap-1.5 border border-slate-700 transition"
      >
        <i data-lucide="volume-2" class="w-4 h-4"></i>
        <span>데스크톱 알림</span>
      </button>

      <!-- Export CSV -->
      <a 
        href="/api/admin/export" 
        download 
        class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition"
      >
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>고객 대장 다운로드 (CSV)</span>
      </a>

      <!-- Open Customer View in new tab -->
      <a 
        href="/" 
        target="_blank" 
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs flex items-center gap-1 border border-slate-700 transition"
        title="고객 화면 열기"
      >
        <i data-lucide="external-link" class="w-4 h-4"></i>
      </a>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- ================= LEFT: CUSTOMER ROOM LIST ================= -->
    <aside class="w-80 md:w-96 bg-white border-r border-slate-200 flex flex-col shrink-0">
      
      <!-- Search & Filters -->
      <div class="p-3 border-b border-slate-100 bg-slate-50/70 space-y-2">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input 
            type="text" 
            id="roomSearchInput" 
            placeholder="고객명 또는 전화번호 검색..." 
            class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 transition"
          >
        </div>

        <div class="flex gap-1 text-xs">
          <button data-status="all" class="filter-tab flex-1 py-1.5 rounded-md font-medium text-slate-600 bg-white shadow-2xs border border-slate-200 text-center transition">
            전체 (<span id="countAll">0</span>)
          </button>
          <button data-status="active" class="filter-tab flex-1 py-1.5 rounded-md font-medium text-blue-600 bg-blue-50/80 border border-blue-200 text-center transition">
            진행 중 (<span id="countActive">0</span>)
          </button>
          <button data-status="closed" class="filter-tab flex-1 py-1.5 rounded-md font-medium text-slate-500 hover:bg-white border border-transparent text-center transition">
            종료 (<span id="countClosed">0</span>)
          </button>
        </div>
      </div>

      <!-- Room List Items -->
      <div id="roomListContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100">
        <!-- Rendered by JS -->
      </div>

    </aside>

    <!-- ================= CENTER: ACTIVE CHAT THREAD ================= -->
    <main class="flex-1 flex flex-col bg-slate-100 relative">
      
      <!-- Empty Placeholder when no room is selected -->
      <div id="noRoomSelected" class="flex-1 flex flex-col items-center justify-center text-slate-400 p-8">
        <div class="w-16 h-16 rounded-2xl bg-white border border-slate-200/80 shadow-xs flex items-center justify-center text-slate-300 mb-4">
          <i data-lucide="message-square-dashed" class="w-8 h-8"></i>
        </div>
        <h3 class="text-base font-bold text-slate-700">선택된 상담이 없습니다</h3>
        <p class="text-xs text-slate-400 mt-1">왼쪽 목록에서 고객을 클릭하여 실시간 상담을 시작하세요.</p>
      </div>

      <!-- Active Chat Container (hidden by default) -->
      <div id="activeChatContainer" class="hidden flex-1 flex flex-col h-full bg-slate-100">
        
        <!-- Chat Header -->
        <div class="bg-white px-5 py-3 border-b border-slate-200 flex items-center justify-between shadow-2xs z-10">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-700 text-sm">
              <span id="headerCustomerAvatar">고객</span>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 id="headerCustomerName" class="font-bold text-slate-900 text-sm">홍길동</h2>
                <span id="headerStatusBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">진행중</span>
              </div>
              <div class="flex items-center gap-3 text-xs text-slate-500 mt-0.5">
                <span class="flex items-center gap-1">
                  <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400"></i>
                  <a id="headerCustomerPhone" href="tel:" class="hover:text-blue-600 font-mono">010-0000-0000</a>
                </span>
                <span class="text-slate-300">|</span>
                <span id="headerCreatedAt" class="text-[11px] text-slate-400">시작: 2026-11-24 18:00</span>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-2">
            <button 
              id="adminCopyCustomerLink" 
              class="px-2.5 py-1.5 text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center gap-1 transition"
              title="고객에게 공유할 상담 링크 복사"
            >
              <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
              <span>상담 링크 복사</span>
            </button>

            <button 
              id="toggleStatusBtn" 
              class="px-3 py-1.5 text-xs font-semibold rounded-lg transition flex items-center gap-1.5"
            >
              <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
              <span id="toggleStatusText">상담 완료 처리</span>
            </button>

            <!-- Toggle Notes Drawer Button -->
            <button 
              id="toggleNotesPanelBtn" 
              class="px-2.5 py-1.5 text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center gap-1 transition"
              title="고객 메모 열기/닫기"
            >
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
              <span>상담 메모</span>
            </button>
          </div>
        </div>

        <!-- Inner Content (Messages + Optional Memo Panel) -->
        <div class="flex-1 flex overflow-hidden relative">
          
          <!-- Message Thread Section -->
          <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100">
            <!-- Messages Container -->
            <div id="adminMessagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
              <!-- Rendered messages -->
            </div>

            <!-- Customer Typing Indicator -->
            <div id="adminCustomerTyping" class="hidden px-4 py-1 text-xs text-slate-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-ping"></span>
              <span>고객님이 메시지를 작성 중입니다...</span>
            </div>

            <!-- Canned Responses (자주 쓰는 답변 템플릿) -->
            <div class="px-4 py-2 bg-white border-t border-slate-200/60 flex items-center gap-1.5 overflow-x-auto text-xs">
              <span class="text-slate-400 text-[11px] whitespace-nowrap shrink-0">빠른 답변:</span>
              <button class="canned-btn whitespace-nowrap bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200/80 transition">
                👋 안녕하세요! 무엇을 도와드릴까요?
              </button>
              <button class="canned-btn whitespace-nowrap bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200/80 transition">
                ⏳ 확인 후 바로 회신드리겠습니다.
              </button>
              <button class="canned-btn whitespace-nowrap bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200/80 transition">
                ✅ 요청하신 내용 처리가 완료되었습니다.
              </button>
              <button class="canned-btn whitespace-nowrap bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200/80 transition">
                🙏 상담이 종료되었습니다. 감사합니다!
              </button>
            </div>

            <!-- Admin Input Box -->
            <div class="bg-white p-3 border-t border-slate-200">
              <form id="adminMessageForm" class="flex items-end gap-2">
                <textarea 
                  id="adminMessageInput" 
                  rows="2" 
                  placeholder="답변을 입력하세요... (Enter: 전송 / Shift+Enter: 줄바꿈)" 
                  class="flex-1 bg-slate-100 border border-transparent focus:border-blue-500 focus:bg-white rounded-xl p-3 text-sm focus:outline-none transition resize-none"
                ></textarea>
                <button 
                  type="submit" 
                  class="h-11 px-5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-1.5 transition shadow-sm shrink-0"
                >
                  <span>전송</span>
                  <i data-lucide="send" class="w-4 h-4"></i>
                </button>
              </form>
            </div>
          </div>

          <!-- ================= RIGHT: CUSTOMER NOTES & INFO PANEL ================= -->
          <aside id="notesPanel" class="w-72 bg-white border-l border-slate-200 p-4 flex flex-col shrink-0 shadow-sm transition-all duration-200">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-blue-600"></i>
                고객 정보 및 상담 메모
              </h3>
            </div>

            <!-- Customer Meta Info -->
            <div class="py-3 space-y-2 text-xs border-b border-slate-100">
              <div>
                <span class="text-slate-400">고객 성함:</span>
                <span id="metaCustomerName" class="font-semibold text-slate-700 ml-1">-</span>
              </div>
              <div>
                <span class="text-slate-400">전화번호:</span>
                <span id="metaCustomerPhone" class="font-semibold text-slate-700 ml-1 font-mono">-</span>
              </div>
              <div>
                <span class="text-slate-400">최초 문의내용:</span>
                <p id="metaInitialInquiry" class="mt-1 p-2 bg-slate-50 border border-slate-100 rounded text-slate-600 break-words">
                  없음
                </p>
              </div>
            </div>

            <!-- Private Admin Memo -->
            <div class="flex-1 flex flex-col pt-3">
              <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center justify-between">
                <span>관리자 전용 메모</span>
                <span class="text-[10px] text-slate-400 font-normal">고객에게 보이지 않음</span>
              </label>
              <textarea 
                id="adminNotesTextarea" 
                placeholder="특이사항, 고객 상담 내용, 후속 조치 필요사항을 기록하세요." 
                class="flex-1 w-full p-2.5 bg-amber-50/50 border border-amber-200/80 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-500 resize-none transition"
              ></textarea>
              <button 
                id="saveNotesBtn" 
                class="mt-2 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5"
              >
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                <span>메모 저장</span>
              </button>
            </div>
          </aside>

        </div>

      </div>

    </main>

  </div>

  <!-- Toast for Admin -->
  <div id="adminToast" class="fixed bottom-6 right-6 bg-slate-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="adminToastMsg">알림</span>
  </div>

  <!-- Socket.IO & Admin Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
